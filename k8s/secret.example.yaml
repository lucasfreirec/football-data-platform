# EXAMPLE ONLY. Do not put real credentials in this file or commit them.
#
# Create the real Secret from your own values instead:
#
#   kubectl -n football-data create secret generic football-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://USER:PASSWORD@HOST:5432/DBNAME' \
#     --from-literal=BROKER_URL='redis://HOST:6379/0'
#
# Prefer your platform's secret manager (External Secrets, Sealed Secrets, a CSI driver)
# over a hand-made Secret in production. PostgreSQL and Redis are external to this
# deployment, for example managed services.
apiVersion: v1
kind: Secret
metadata:
  name: football-secrets
  namespace: football-data
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://REPLACE_ME:REPLACE_ME@postgres.example.internal:5432/football_data
  BROKER_URL: redis://redis.example.internal:6379/0
