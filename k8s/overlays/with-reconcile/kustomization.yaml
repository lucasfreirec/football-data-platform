apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: football-data

# Everything in ../../base plus the optional reconcile CronJob.
resources:
  - ../../base
  - reconcile-cronjob.yaml

# Image settings of ../ do not reach resources added here, so repeat them. Keep this in
# step with ../../base/kustomization.yaml (a test checks that they agree).
images:
  - name: football-data-platform
    newTag: "0.2.0"
