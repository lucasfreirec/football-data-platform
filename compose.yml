services:
  db:
    image: postgres:16-alpine
    container_name: football-data-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football_data}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - football_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-football_data}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  broker:
    image: redis:7-alpine
    container_name: football-data-broker
    # Jobs live in PostgreSQL, so the broker needs no persistence: a restart loses
    # queued messages, and `reconcile-stale` re-queues the jobs they belonged to.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  football_db_data:
