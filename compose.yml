services:
  db:
    image: postgres:16-alpine
    container_name: football-data-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football_data}
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - football_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football} -d ${POSTGRES_DB:-football_data}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  football_db_data:
