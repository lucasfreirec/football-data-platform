global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  # One API process (or several replicas behind the service name).
  - job_name: football-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # `docker compose up --scale worker=N` gives the `worker` name N addresses; DNS service
  # discovery scrapes each one, so every replica is a separate target.
  - job_name: football-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 15s

